<style>
:root{color-scheme:light;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#282d29;background:#faf9f6;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:664px;margin:clamp(56px,13vh,132px) auto;padding:0 32px 64px}
h1{font-size:15px;line-height:1.5;font-weight:550;margin:0 0 64px;color:#555e56}

nav{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:15px;font-size:14px}
a{color:inherit;text-underline-offset:5px;text-decoration-thickness:1px;text-decoration-color:#a5ada4}
h2 a{text-decoration:none}
h2 a::after{content:"→";display:inline-block;margin-left:12px;font:400 17px/1 system-ui,sans-serif;vertical-align:middle;color:#768272}
a:hover{color:#3d5c40;text-decoration-color:currentColor}
h2 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
a:focus-visible{outline:2px solid #3d5c40;outline-offset:6px;border-radius:1px}
nav a{display:inline-block;padding:5px 0}
.skip{position:absolute;top:-100px;left:20px;background:#fff;padding:10px}
.skip:focus{top:10px}
@media(max-width:480px){main{padding:0 26px 48px;margin-top:56px}h1{margin-bottom:48px}section+section{margin-top:40px}h2{font-size:28px}}
@media(prefers-reduced-motion:no-preference){a{transition:color .15s ease,text-decoration-color .15s ease}}
</style>
</head>
