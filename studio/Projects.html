<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applied AI Studio | Projects 2–8</title><style>
:root{--ink:#383d37;--cream:#fffdf7;--cyan:#17acdf;--orange:#ff653c;--lime:#c9e65c;--aqua:#a8e5e8}*{box-sizing:border-box}body{margin:0;background:#f4f3e9;color:var(--ink);font:16px/1.55 'Lexend',system-ui,sans-serif}header{background:var(--ink);color:white;padding:20px max(22px,calc((100vw - 1120px)/2))}header strong{font-size:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,.button{cursor:pointer;font:inherit;font-weight:650;border:2px solid var(--ink);border-radius:6px;padding:9px 13px;background:var(--lime);color:var(--ink);text-decoration:none;display:inline-block}button:hover,.button:hover,button:focus-visible,.button:focus-visible{background:var(--aqua)!important;color:var(--ink)!important;outline:2px solid var(--cyan);outline-offset:2px}header button{background:var(--cream)}main{max-width:1120px;margin:auto;padding:28px 20px 70px}h1{font:700 clamp(30px,4vw,48px)/1.15 Georgia,serif;margin:10px 0}h2{font:700 28px Georgia,serif}h3{margin:10px 0}p{max-width:78ch}.muted{color:#535d56}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.09em;font-weight:750}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card,.panel{border:2px solid var(--ink);background:var(--cream);padding:20px;border-radius:10px}.card{display:flex;flex-direction:column}.card button{margin-top:auto;align-self:flex-start}.pill{font-size:12px;background:var(--aqua);padding:4px 8px;display:inline-block;font-weight:750}.stages{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.stages button{background:#fff}.stages button.active{background:var(--orange)}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:18px}label{display:block;font-weight:750;margin:15px 0 5px}textarea,select{font:inherit;border:2px solid #737c73;background:#fff;width:100%;border-radius:5px;padding:11px}textarea{min-height:150px;resize:vertical}.hint{background:#e7f6f8;border-left:5px solid var(--cyan);padding:13px;margin:13px 0}.notice{background:#fff2d9;padding:12px;border-left:5px solid var(--orange)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}ul{padding-left:23px}li{margin-bottom:6px}footer{margin-top:32px;border-top:1px solid #9fa99e;padding-top:12px;font-size:13px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:20px 12px}header{padding:16px}}

header a.home-link{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 14px;border:1px solid #a8e5e8;border-radius:4px;background:#383d37;color:#fff;font:700 12px/1.4 Arial,sans-serif;text-decoration:none;white-space:nowrap}header a.home-link:hover,header a.home-link:focus-visible{background:#a8e5e8;color:#252b27;outline:2px solid #ffe51c;outline-offset:2px}
.project-backups{max-width:1080px;margin:22px auto 0;padding:16px 20px;border:1px solid #a9b4a8;background:#fffdf7;border-radius:5px}.project-backups summary{cursor:pointer;font-weight:800}.project-backups p{font-size:13px}.project-backups .actions button{font-size:12px}@media(max-width:760px){.project-backups{margin:16px 12px 0}}</style><link rel="stylesheet" href="../assets/topbar.css?v=1"><link rel="stylesheet" href="../assets/accessibility.css?v=1"><script src="../assets/accessibility.js?v=1" defer></script></head><body><a class="skip-link" href="#app">Skip to content</a><header class="site-topbar"><strong>Applied AI Lab · Studio</strong><div class="eyebrow">Independent projects · Games 2–8</div><nav><a class="home-link" href="../" onclick="if(gameId)persist()">Home</a><button onclick="returnToStudio()">Games/Projects</button><a class="button" href="resources.html" onclick="if(gameId)persist()">Resource Library</a></nav></header><details class="project-backups" id="projectBackups"><summary>Progress & backups · Games 2–8</summary><p>Your written responses and self-review status save in this browser. These backups cover Games 2–8; Reporting Rescue has its own backup in Games/Projects.</p><div class="actions"><button onclick="downloadBackup()">Export progress</button><button onclick="showBackupText()">Show backup text</button><button onclick="restoreBackup()">Restore progress</button><button onclick="restoreBackupText()">Restore backup text</button></div></details><main id="app" tabindex="-1"></main><script>
'use strict';const GAMES={"G02": {"title": "The Document Detective", "focus": "Retrieval, grounding, access control", "brief": "A visitor-services team needs answers from a changing collection of policy documents. An assistant has quoted a superseded policy and exposed information intended for managers.", "expert": "Knowledge manager", "facts": ["The policy folder contains versions dated March and September; only September is current.", "Visitor-facing staff can read the public guidance, but not manager-only incident notes.", "A correct answer must cite the current policy section; unsupported answers should be withheld."], "challenge": ["Ask which documents are authoritative, who may read them, and how updates are published.", "Design ingestion, version control, permission filtering, retrieval, citations, and an abstention rule.", "Specify a test set with current, obsolete, ambiguous, and restricted questions; describe the retrieval and generation steps.", "A staff account receives an answer quoting manager-only notes. Trace the failure and propose a containment and regression test.", "Explain why the assistant should sometimes decline to answer, first to an employee and then to Technology."], "technical": "Document chunking, metadata filters, retrieval precision, citations, authorization at query time, evaluation set"}, "G03": {"title": "The Overflowing Inbox", "focus": "Classification, workflow automation, human review", "brief": "A shared operations inbox receives service requests, urgent safety issues, duplicates, and confidential employee information. The team wants faster responses without losing control of important decisions.", "expert": "Operations coordinator", "facts": ["A safety issue must reach a human immediately.", "Some messages contain employee data and must remain in restricted systems.", "The team can supply 50 anonymized examples and its existing escalation guide."], "challenge": ["Determine message categories, current response times, routing rules, and exceptions.", "Compare deterministic routing rules with model-assisted classification; define confidence thresholds and escalation.", "Design a processing flow with idempotency, audit records, queue handling, and a small labeled evaluation set.", "A duplicate message triggers two tickets while an urgent report is labeled routine. Diagnose and revise the controls.", "Explain the workflow to the employee who will supervise it, including what happens when it is wrong."], "technical": "Classification metrics, false negatives, confidence calibration, idempotency, queue design, access boundaries"}, "G04": {"title": "The Comparison Trap", "focus": "Evaluation design and defensible selection", "brief": "Three vendors demonstrate convincing summaries of operational reports. Their advertised accuracy figures were calculated on different datasets and none has supplied a complete failure analysis.", "expert": "Procurement analyst", "facts": ["Vendor A reports 94% on 50 handpicked examples.", "Vendor B reports 88% on 400 representative examples, with documented failures.", "Vendor C offers the lowest price but has not described data retention or audit logs."], "challenge": ["Identify what evidence is missing and which decision criteria matter.", "Propose a common evaluation protocol with comparable tasks, risks, costs, and minimum acceptance thresholds.", "Construct a scorecard, sampling plan, and reproducible test procedure; separate quality from marketing claims.", "The best-scoring vendor fails on a small but high-risk category. Decide whether to block, mitigate, or narrow the pilot.", "Write a concise decision memo to Finance/Strategy and a technical appendix for Technology."], "technical": "Sampling bias, precision and recall, stratified tests, statistical uncertainty, procurement controls"}, "G05": {"title": "The Idea Gauntlet", "focus": "Portfolio intake and prioritization", "brief": "Four departments request AI projects at once: month-end reporting, visitor FAQs, staff scheduling, and donor correspondence. The team can deliver only one pilot this quarter.", "expert": "Strategy and finance partner", "facts": ["Reporting consumes six staff hours monthly and has stable source exports.", "Visitor FAQs are high-volume but policy changes are frequent.", "Staff scheduling involves sensitive employment records.", "Donor correspondence has no agreed quality baseline."], "challenge": ["Interview sponsors to establish the problem, owner, data readiness, and success measure for each request.", "Build a prioritization method that considers value, feasibility, risk, dependencies, and capacity.", "Prepare a comparative intake matrix and a pilot charter with a bounded scope and exit criteria.", "The preferred sponsor asks to double scope without more resources. Reprioritize and document the tradeoff.", "Defend your decision to two sponsors with competing priorities without inventing a guaranteed ROI."], "technical": "Weighted decision models, sensitivity analysis, dependency mapping, baseline measurement, scope control"}, "G06": {"title": "The Agent With Boundaries", "focus": "Tool permissions and bounded autonomy", "brief": "A proposed internal assistant can read project records, draft status updates, and create follow-up tasks. A sponsor now asks it to approve spending and send external messages automatically.", "expert": "IT security architect", "facts": ["Project records contain different access tiers.", "Task creation is reversible; external email and spending approval have larger consequences.", "The organization already uses Microsoft identity and workflow tools."], "challenge": ["Identify authorized users, tool owners, sensitive data, and actions requiring approval.", "Design an agent with explicit tool schemas, least-privilege scopes, and human confirmation for consequential actions.", "Map a multi-step workflow including validation, retries, timeouts, logging, and a safe stop condition.", "A prompt injection in a retrieved note requests an external export. Explain how the boundary holds and how to test it.", "Explain the proposed controls to an executive and a technical reviewer without suggesting the agent is infallible."], "technical": "Tool calling, OAuth scopes, prompt injection, allowlists, human authorization, observability"}, "G07": {"title": "The Workflow That Broke", "focus": "Incident analysis and system reliability", "brief": "An automated weekly report contains incorrect totals. The system ran without an error message, and leaders have already seen the report.", "expert": "Quality and operations lead", "facts": ["The source export changed a column name without notice.", "The workflow silently treated missing values as zero.", "A previous verified report is available and can be restored."], "challenge": ["Establish incident severity, affected outputs, owners, and immediate containment.", "Trace data lineage and propose checks for schema changes, missing values, and reconciliation failures.", "Write a root-cause analysis and a test plan with unit, integration, and regression cases.", "A second failure appears after the fix. Determine whether to roll back, pause, or proceed with safeguards.", "Communicate the incident to affected employees and executives, preserving uncertainty and accountability."], "technical": "Schema validation, monitoring, alert thresholds, rollback, regression testing, incident postmortems"}, "G08": {"title": "Launch Day", "focus": "Pilot delivery, adoption, and executive reporting", "brief": "A cross-departmental pilot is ready for release. Technical testing is encouraging, but staff training is incomplete and the sponsor wants an immediate organization-wide launch.", "expert": "People and communications lead", "facts": ["Twenty pilot users volunteered; the broader team has not been trained.", "The baseline process takes 25 minutes per case, with substantial variation.", "Support ownership, incident escalation, and a retention policy still need confirmation."], "challenge": ["Identify stakeholder needs, launch dependencies, readiness gaps, and who can authorize expansion.", "Design a phased rollout with training, accessibility, communications, support, and governance sign-off.", "Define adoption and quality measures, a baseline comparison, feedback collection, and a dashboard.", "Pilot usage is high but error rates rise for one user group. Decide whether to pause expansion and how to investigate.", "Deliver a two-minute executive briefing, then answer an employee concern about job displacement and a technical question about reliability."], "technical": "Pilot experiment design, adoption denominators, quality metrics, monitoring, staged rollout, rollback criteria"}};const STAGES=['Discover','Design','Build','Break','Explain'];const PREFIX='applied-ai-lab-studio-project-v1-';let gameId=null,stage=0,level='Explorer',showCoaching=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function empty(){return {schema:1,level:'Explorer',stage:0,completed:false,answers:{},consultations:{},coaching:{},updatedAt:null,attemptId:'project-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))}};
function read(id){try{const o=JSON.parse(localStorage.getItem(PREFIX+id)||'null');return o&&o.schema===1&&o.answers&&typeof o.answers==='object'?o:empty()}catch(e){return empty()}}
function save(id,o){o.updatedAt=new Date().toISOString();try{localStorage.setItem(PREFIX+id,JSON.stringify(o));$('save-status')&&$('save-status').textContent!=='Progress saved on this device'&&($('save-status').textContent='Progress saved on this device')}catch(e){alert('Local save failed. Export your work now; check browser storage permissions.')}}
function returnToStudio(){if(gameId)persist();window.location.href='Index.html';}
function showHub(){if(gameId)persist();gameId=null;let cards=Object.entries(GAMES).map(([id,g])=>{let p=read(id);return `<article class="card"><span class="pill">${id} · ${p.completed?'Self-reviewed':Object.keys(p.answers).length?'In progress':'Available'}</span><h2>${esc(g.title)}</h2><p>${esc(g.focus)}</p><p class="muted">${Object.keys(p.answers).length}/5 stage responses saved</p><button onclick="openGame('${id}')">${p.completed?'Review project':Object.keys(p.answers).length?'Continue':'Open project'}</button></article>`}).join('');$('app').innerHTML=`<div class="eyebrow">Level 02 / Applied AI Studio</div><h1>Independent technical projects</h1><p>Open any project in any order. Each contains its own scenario, departmental reference, technical requirements, and five stages. Work is saved in this browser; download backups for recovery. Reporting Rescue uses scored practice; these seven projects use written responses and self-review.</p><div class="grid">${cards}</div><footer>Projects 2–8 · local practice · browser-local progress · no AI API calls</footer>`}
function openGame(id){if(!GAMES[id])return;if(gameId)persist();gameId=id;const p=read(id);if(!p.attemptId){p.attemptId=empty().attemptId;save(id,p);}stage=Math.min(4,Math.max(0,p.stage||0));level=p.level||'Explorer';render()}
function render(){const g=GAMES[gameId],p=read(gameId);if(!g)return showHub();const s=STAGES[stage];const answer=p.answers[s]||'';const consult=p.consultations[s]||'';const coached=!!p.coaching[s];$('app').innerHTML=`<div class="eyebrow">${gameId} / ${esc(g.focus)}</div><h1>${esc(g.title)}</h1><p>${esc(g.brief)}</p><label for="level">Practice level</label><select id="level" onchange="changeLevel(this.value)">${['Explorer','Builder','Architect'].map(x=>`<option ${level===x?'selected':''}>${x}</option>`).join('')}</select><div class="stages">${STAGES.map((x,i)=>`<button class="${i===stage?'active':''}" onclick="goStage(${i})" aria-current="${i===stage?'step':'false'}">${i+1}. ${x}${p.answers[x]?' ✓':''}</button>`).join('')}</div><div class="layout"><section class="panel"><span class="pill">Stage ${stage+1} of 5 · ${s}</span><h2>${s}</h2><p>${esc(g.challenge[stage])}</p><div class="hint"><strong>Technical requirements</strong><p>${esc(g.technical)}</p></div><label for="answer">Your analysis, design, or decision</label><textarea id="answer" oninput="persist()" placeholder="Explain your assumptions, evidence, technical choices, tests, and unresolved questions.">${esc(answer)}</textarea><p id="save-status" class="muted" aria-live="polite">Saved on this device when edited</p><div class="actions"><button onclick="copyTutor()">Copy workbench prompt</button><button onclick="toggleCoaching()">${coached?'Hide':'Show'} optional coaching</button><button onclick="goStage(${Math.min(stage+1,4)})">${stage===4?'Review project':'Next stage →'}</button></div><div id="coaching" class="hint ${coached?'':'hidden'}"><strong>Instructional support · ${level}</strong><p>${level==='Explorer'?'Begin by separating known facts from assumptions. Identify a concrete decision and the evidence needed to support it.':level==='Builder'?'Identify the tradeoff, choose a test that could disprove your approach, and explain how you would respond to failure.':'Make an independent recommendation with explicit acceptance criteria, ownership, and rollback or escalation conditions.'}</p><p>Using this guidance is recorded separately from consulting a department expert.</p></div>${stage===4?`<div class="notice"><strong>Explain it to the room.</strong> Include one accurate explanation for the intended business audience and a second for a technical partner. State what remains uncertain. This is a self-assessment, not an automated grade.</div><label><input type="checkbox" id="complete" ${p.completed?'checked':''} onchange="setComplete(this.checked)"> Mark this project reviewed (self-assessment)</label>`:''}</section><aside class="panel"><h3>Consult a department expert</h3><p><strong>${esc(g.expert)}</strong></p><p>These are fictional but realistic reference facts. They are not live conversations with AWE employees.</p><ul>${g.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul><label for="consult">Questions to ask / information still needed</label><textarea id="consult" oninput="persist()" placeholder="Record what you would ask the SME and what still needs verification.">${esc(consult)}</textarea><h3>Evidence checklist</h3><ul><li>State the source and limits of each important claim.</li><li>Keep technical detail sufficient to justify the design.</li><li>Specify tests and failure handling.</li><li>Identify the human owner of consequential decisions.</li><li>Explain the decision in language appropriate to its audience.</li></ul></aside></div><div class="actions"><button onclick="showHub()">← All projects</button><button onclick="downloadBackup()">Download backup</button></div><footer>Each stage is accessible independently. There are no completion gates. Progress is stored separately from Foundations and Game 1.</footer>`;}
function persist(){if(!gameId)return;const p=read(gameId),s=STAGES[stage];p.answers[s]=$('answer').value;p.consultations[s]=$('consult').value;p.stage=stage;p.level=level;save(gameId,p)}
function goStage(i){persist();stage=i;render();window.scrollTo(0,0)}
function changeLevel(x){persist();level=x;const p=read(gameId);p.level=x;save(gameId,p);render()}
function toggleCoaching(){persist();const p=read(gameId),s=STAGES[stage];p.coachingUsed=p.coachingUsed||{};p.coachingUsed[s]=true;p.coaching[s]=!p.coaching[s];save(gameId,p);render()}
function setComplete(v){persist();const p=read(gameId);p.completed=v;save(gameId,p)}
function copyTutor(){persist();const g=GAMES[gameId],s=STAGES[stage],p=read(gameId);const prompt=`Act as a rigorous but supportive technical reviewer for Applied AI Studio ${gameId}, ${g.title}. Stage: ${s}. Practice level: ${level}. Scenario: ${g.brief}. Task: ${g.challenge[stage]}. Technical requirements: ${g.technical}. My draft: ${p.answers[s]||'(none)'}. Ask me to defend assumptions, propose meaningful tests, and explain risks. Do not solve the exercise for me without first probing my reasoning. Avoid corporate slogans, gratuitous taxonomies, and unearned praise. Do not request confidential information.`;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(prompt).then(()=>alert('Prompt copied. Paste it into your own ChatGPT conversation.')).catch(()=>fallbackCopy(prompt))}else fallbackCopy(prompt)}
function fallbackCopy(t){prompt('Copy this workbench prompt:',t)}
function showBackupText(){if(gameId)persist();const projects=Object.fromEntries(Object.keys(GAMES).map(id=>[id,read(id)]));let box=document.getElementById('backupText');if(!box){box=document.createElement('textarea');box.id='backupText';box.setAttribute('aria-label','Complete projects backup JSON');box.readOnly=true;document.getElementById('projectBackups').appendChild(box);}box.value=JSON.stringify({schema:'applied-ai-studio-projects-v1',exportedAt:new Date().toISOString(),projects},null,2);box.scrollIntoView();}
function downloadBackup(){if(gameId)persist();const projects={};Object.keys(GAMES).forEach(id=>projects[id]=read(id));const b=new Blob([JSON.stringify({schema:'applied-ai-studio-projects-v1',exportedAt:new Date().toISOString(),projects},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='applied-ai-studio-projects-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validateProjectsBackup(raw){
 if(typeof raw!=='string'||raw.length>2000000)throw Error('Backup exceeds 2 MB');
 const o=JSON.parse(raw);if(o.schema!=='applied-ai-studio-projects-v1'||!o.projects||Array.isArray(o.projects)||typeof o.projects!=='object')throw Error('Not a Studio projects backup');
 const entries=Object.entries(o.projects);if(!entries.length||entries.length>7)throw Error('Invalid project count');
 const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
 for(const [id,p] of entries){if(!GAMES[id]||!obj(p)||p.schema!==1||!['Explorer','Builder','Architect'].includes(p.level)||!Number.isInteger(p.stage)||p.stage<0||p.stage>4||typeof p.completed!=='boolean'||!obj(p.answers)||!obj(p.consultations)||!obj(p.coaching))throw Error('Invalid project record');for(const field of ['answers','consultations'])for(const [k,v] of Object.entries(p[field]))if(!STAGES.includes(k)||typeof v!=='string'||v.length>100000)throw Error('Invalid stage response');for(const [k,v] of Object.entries(p.coaching))if(!STAGES.includes(k)||typeof v!=='boolean')throw Error('Invalid support record');}
 return entries;
}
function restoreProgressText(raw){try{const entries=validateProjectsBackup(raw);if(!confirm('Restore '+entries.length+' projects? Matching progress will be replaced after a local recovery snapshot is saved. Nothing is reported.'))return;const previous={};for(const [id]of entries)previous[id]=localStorage.getItem(PREFIX+id);localStorage.setItem(PREFIX+'pre-restore-'+Date.now(),JSON.stringify(previous));try{for(const [id,p]of entries)localStorage.setItem(PREFIX+id,JSON.stringify(p));}catch(e){for(const [id,v]of Object.entries(previous))v===null?localStorage.removeItem(PREFIX+id):localStorage.setItem(PREFIX+id,v);throw e;}if(gameId){const p=read(gameId);stage=p.stage;level=p.level;render();}else showHub();alert('Project progress restored.');}catch(e){alert('Backup not restored: '+e.message);}}
function restoreBackupText(){const raw=prompt('Paste the complete JSON projects backup. It stays in your browser.');if(raw!==null)restoreProgressText(raw);}
function restoreBackup(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.hidden=true;document.body.appendChild(f);f.onchange=async()=>{if(f.files&&f.files[0])restoreProgressText(await f.files[0].text());f.remove();};f.click();}

const q=new URLSearchParams(location.search).get('game');if(q&&GAMES[q])openGame(q);else showHub();
</script></body></html>
